[workspace]
members = [
  "crates/checkbook-domain",
  "crates/checkbook-application",
  "crates/checkbook-postgres",
  "crates/checkbook-documents",
  "crates/checkbook-api",
  "crates/checkbook",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1"
axum = { version = "0.8.9", features = [
  "http2",
  "json",
  "macros",
  "multipart",
] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
http = "1.3"
jsonwebtoken = { version = "10", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rust_decimal = { version = "1.39", features = [
  "db-postgres",
  "serde-with-float",
  "serde-with-str",
] }
rust_decimal_macros = "1.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
  "rust_decimal",
  "uuid",
] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = [
  "cors",
  "request-id",
  "timeout",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
typst-as-lib = "0.16.0"
typst = "0.15.0"
typst-layout = "0.15.0"
typst-pdf = "0.15.0"
utoipa = { version = "5.5", features = [
  "axum_extras",
  "chrono",
  "decimal",
  "uuid",
] }
uuid = { version = "1.19", features = ["serde", "v4", "v7"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
# Force updated versions to fix security issues
crossbeam-epoch = "0.9.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false
